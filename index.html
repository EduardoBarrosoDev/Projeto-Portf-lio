<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Controle financeiro</h1>
        <p>Facilitando sua organização financeira</p>
    </header>
    <main>

        <!--Sessão de movimentação-->
        <section class="movie">
            <h2>Movimentação</h2>

            <p>
                <strong>Saldo</strong>
                <span id="iSaldo">R$ 0,00 </span>
            </p>

            <p>
                <strong>Entrada</strong>
                <span id="iEntrada">R$ 0,00 </span>
            </p>

            <p>
                <strong>Saída</strong>
                <span id="iSaida"> R$ 0,00 </span>
            </p>
        </section>

        <!--Sessão de novas movimentações-->
        <section class="movie">
            <h2>Nova movimentação</h2>
            <label for="iDescricao">Descrição</label>
            <input class="campo" type="text" name="descricao" id="iDescricao">

            <label for="iValor">Valor</label>
            <input class="campo" type="number" name="valor" id="iValor">

            <!--Opção de entrada e saída-->
            <input class="campo" type="radio" name="opcao" id="iEntrou">
            <label for="iEntrou">Entrada</label>
            <input class="campo" type="radio" name="opcao" id="iSaiu">
            <label for="iSaiu">Saída</label>

            <button>Finalizar</button>
        </section>

        <!--Sessão para histório de movimentação-->
        <section id="historico">
            <h2>Histórico</h2>
        </section>

    </main>

    <script src="js/script.js"></script>
</body>
</html>
